          { title: "🚉 難波去關西機場 🛩️", map: "關西國際機場", options: ["1. 🚝 搭南海Rapi:t特急：一程，￥1450，~38min","2. 🚃 搭南海本線（急行）：一程，￥930，~45min","3. 🚌 搭利木津巴士：一程，￥1600，~50min（唔塞車時）"], hasSeparator: false, ps: "" },
          { title: "🚉 大阪難波去關西機場（先去臨空城Outlet） 🛍️", map: "臨空城Outlet", optionsPart1: ["1. 🚃 搭南海本線（急行）：難波→臨空城，￥770，~35min","2. 🚝 搭南海Rapi:t特急：難波→臨空城，￥1450，~30min","3. 🚌 搭利木津巴士：難波→臨空城Outlet，￥1600，~45min"], optionsPart2: ["1. 🚃 搭南海本線（普通）：臨空城→關西機場，￥370，~5min","2. 🚝 搭JR關空快速：臨空城→關西機場，￥400，~5min"], hasSeparator: true, ps: "P.S. 臨空城站有行李locker，站外邊都有舖頭寄存行李 🧳" }
        ]
      };

      const DEFAULT_TRANSPORT = JSON.parse(JSON.stringify(appData.transportData));
      const DEFAULT_PEOPLE = [...appData.people];
      const DEFAULT_MEMOS = JSON.parse(JSON.stringify(appData.memos));

      async function uploadToCloud() {
        if (isUploading) return; isUploading = true;
        try {
          appData._lastUpdated = Date.now();
          const fd = new URLSearchParams(); fd.append('action','save'); fd.append('data',JSON.stringify(appData));
          const r = await fetch(GOOGLE_SCRIPT_URL,{method:'POST',body:fd}); const j = await r.json();
          if (j.success) { appData._lastUpdated = j.serverTimestamp; saveToStorage(); document.getElementById('saveStatus').innerHTML='☁️ 已同步'; document.getElementById('syncStatus').textContent='✅ 已同步到雲端'; setTimeout(()=>{document.getElementById('saveStatus').innerHTML='💾 已儲存'},2000); }
          else if (j.message==='版本過舊，請先同步最新資料') { document.getElementById('syncStatus').textContent='⚠️ 版本衝突，正在同步...'; await downloadFromCloud(true); }
        } catch(e) { document.getElementById('syncStatus').textContent='⚠️ 同步失敗'; }
        isUploading = false;
      }

      async function downloadFromCloud(showAlert=false) {
        try {
          const r = await fetch(`${GOOGLE_SCRIPT_URL}?action=load&t=${Date.now()}`); const d = await r.json();
          if (d && d.tripDays) {
            const ct = d._serverTimestamp||0, lt = appData._lastUpdated||0;
            if (ct > lt) {
              const merged = { ...appData, ...d, settledItems:{...appData.settledItems,...(d.settledItems||{})}, itineraryOpen:{...appData.itineraryOpen,...(d.itineraryOpen||{})}, memoOpen:{...appData.memoOpen,...(d.memoOpen||{})}, _lastUpdated:ct, _serverTimestamp:ct };
              merged.transportData = DEFAULT_TRANSPORT; merged.people = DEFAULT_PEOPLE; merged.memos = DEFAULT_MEMOS;
              if (JSON.stringify({...appData,_lastUpdated:null})!==JSON.stringify({...merged,_lastUpdated:null})) {
                appData = merged; saveToStorage(); renderItinerary(); renderExpenses(); renderTransport(); renderMemos(); updateItineraryWeather();
                document.getElementById('rateInput').value = appData.rate; document.getElementById('saveStatus').innerHTML='☁️ 已更新'; document.getElementById('syncStatus').textContent='📥 已接收雲端更新';
                setTimeout(()=>{document.getElementById('saveStatus').innerHTML='💾 已儲存'},2000);
                if (showAlert) alert('✅ 已從雲端同步最新資料！');
              } else { document.getElementById('syncStatus').textContent='⏱️ 資料已是最新'; }
            }
          }
        } catch(e) { document.getElementById('syncStatus').textContent='⚠️ 無法連接雲端'; }
      }

      function manualSync() { document.getElementById('syncStatus').textContent='🔄 同步中...'; Promise.all([uploadToCloud(),downloadFromCloud(true)]).then(()=>{document.getElementById('syncStatus').textContent='✅ 同步完成'}); }
      function saveToStorage() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify({...appData,version:9})); } catch(e) {} }
      function loadFromStorage() { const raw=localStorage.getItem(STORAGE_KEY); if(raw){ try { const p=JSON.parse(raw); appData={...appData,...p}; appData.transportData=DEFAULT_TRANSPORT; appData.people=DEFAULT_PEOPLE; appData.memos=DEFAULT_MEMOS; } catch(e) {} } }
      function autoSave() { appData._lastUpdated=Date.now(); saveToStorage(); uploadToCloud(); }

      const weatherCache = { data:null, timestamp:null, ttl:30*60*1000 };
      async function fetchWeatherForDays() {
        if (weatherCache.data && (Date.now()-weatherCache.timestamp)<weatherCache.ttl) return weatherCache.data;
        try {
          const [kr, or] = await Promise.all([fetch('https://api.open-meteo.com/v1/forecast?latitude=35.0116&longitude=135.7681&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia/Tokyo&forecast_days=7'),fetch('https://api.open-meteo.com/v1/forecast?latitude=34.6937&longitude=135.5022&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia/Tokyo&forecast_days=7')]);
          const [kd,od] = await Promise.all([kr.json(),or.json()]);
          const icons={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌧️',53:'🌧️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',80:'🌧️',81:'🌧️',82:'🌧️',95:'⛈️'};
          const map={}; kd.daily.time.forEach((d,i)=>map[d]={kyoto:{icon:icons[kd.daily.weather_code[i]]||'🌡️',max:Math.round(kd.daily.temperature_2m_max[i]),min:Math.round(kd.daily.temperature_2m_min[i])}});
          od.daily.time.forEach((d,i)=>{if(map[d])map[d].osaka={icon:icons[od.daily.weather_code[i]]||'🌡️',max:Math.round(od.daily.temperature_2m_max[i]),min:Math.round(od.daily.temperature_2m_min[i])}});
          weatherCache.data=map; weatherCache.timestamp=Date.now(); return map;
        } catch(e) { return null; }
      }

      async function updateItineraryWeather() {
        const tags=document.querySelectorAll('.weather-tag'); tags.forEach(t=>t.classList.add('loading'));
        const data=await fetchWeatherForDays();
        if(!data){tags.forEach(t=>{t.classList.remove('loading');t.textContent='🌡️ 天氣暫無法載入'});return;}
        const mapping={'2026-08-05':'8/5 (三)','2026-08-06':'8/6 (四)','2026-08-07':'8/7 (五)','2026-08-08':'8/8 (六)','2026-08-09':'8/9 (日)','2026-08-10':'8/10 (一)','2026-08-11':'8/11 (二)'};
        tags.forEach(tag=>{tag.classList.remove('loading');const card=tag.closest('.day-card');if(!card)return;const header=card.querySelector('.day-title')?.textContent||'';let matched=null;for(const[api,disp]of Object.entries(mapping))if(header.includes(disp)){matched=api;break;}if(matched&&data[matched]){const w=matched<='2026-08-07'?data[matched].kyoto:data[matched].osaka;tag.textContent=w?`${w.icon} ${w.min}°-${w.max}°C`:'🌡️ 資料缺失';}});
      }

      function enableEditMode(idx) {
        const day=appData.tripDays[idx]; const card=document.querySelectorAll('.day-card')[idx]; const details=card.querySelector('.trip-details');
        const old=details.querySelector('.edit-panel'); if(old)old.remove(); if(!day.times)day.times=day.details.map(()=>'');
        const panel=document.createElement('div'); panel.className='edit-panel';
        panel.innerHTML=`<label>📝 行程重點</label><input type="text" id="editTitle_${idx}" value="${day.title.replace(/"/g,'&quot;')}"><label style="margin-top:10px;">📋 詳細行程項目（時間 + 描述 + 地圖）</label><div id="editItems_${idx}">${day.details.map((d,i)=>`<div class="edit-item" data-index="${i}"><input type="text" class="time-input" value="${(day.times[i]||'')}" placeholder="時間"><input type="text" class="detail-input" value="${d.replace(/"/g,'&quot;')}" placeholder="行程描述"><input type="text" class="map-input" value="${(day.maps[i]||'')}" placeholder="地圖關鍵字"><button class="remove-item-btn" onclick="window.removeEditItem(${idx},${i})">✕</button></div>`).join('')}</div><button class="add-item-btn" onclick="window.addEditItem(${idx})">➕ 增加行程</button><button class="save-edit-btn" onclick="window.saveEdit(${idx})">💾 儲存修改</button>`;
        details.appendChild(panel);
      }
      window.removeEditItem=(d,i)=>{const c=document.getElementById(`editItems_${d}`);const items=c.querySelectorAll('.edit-item');if(items.length<=1){alert('至少保留一個項目');return;}items[i].remove();c.querySelectorAll('.edit-item').forEach((el,j)=>el.dataset.index=j);};
      window.addEditItem=(d)=>{const c=document.getElementById(`editItems_${d}`);const i=c.querySelectorAll('.edit-item').length;const div=document.createElement('div');div.className='edit-item';div.dataset.index=i;div.innerHTML=`<input type="text" class="time-input" placeholder="時間"><input type="text" class="detail-input" placeholder="新行程描述"><input type="text" class="map-input" placeholder="地圖關鍵字"><button class="remove-item-btn" onclick="window.removeEditItem(${d},${i})">✕</button>`;c.appendChild(div);};
      window.saveEdit=(d)=>{const t=document.getElementById(`editTitle_${d}`)?.value.trim();if(t)appData.tripDays[d].title=t;const items=document.querySelectorAll(`#editItems_${d} .edit-item`);const times=[],details=[],maps=[];items.forEach(el=>{const ti=el.querySelector('.time-input')?.value.trim()||'';const de=el.querySelector('.detail-input')?.value.trim();const ma=el.querySelector('.map-input')?.value.trim()||'';if(de){times.push(ti);details.push(de);maps.push(ma);}});if(details.length===0){alert('請至少保留一個行程項目');return;}appData.tripDays[d].times=times;appData.tripDays[d].details=details;appData.tripDays[d].maps=maps;renderItinerary();autoSave();};

      function renderItinerary() {
        const c=document.getElementById('daysContainer'); if(!c)return;
        c.innerHTML=appData.tripDays.map((day,idx)=>{const open=appData.itineraryOpen[idx]||false;return`<div class="day-card"><div class="day-header" data-dayidx="${idx}"><span class="day-title">📌 ${day.date} ${day.title}</span><span class="weather-tag loading">🌡️ 載入中...</span></div><div class="trip-details" style="display:${open?'block':'none'};"><div style="margin-top:6px;font-style:italic;color:#c94b6c;font-size:12px;">🚶‍♀️ 交通：請依出口指標移動</div>${day.details.map((d,i)=>{const time=(day.times&&day.times[i])?day.times[i]:'';const mapLink=(day.maps&&day.maps[i])?`<a class="map-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(day.maps[i])}" target="_blank">🗺️</a>`:'';return`<div class="timeline-item"><span class="item-time">${time||'全天'}</span><span class="item-desc">${d} ${mapLink}</span></div>`;}).join('')}${day.ps?`<div class="transport-ps">${day.ps} ${day.psMap?`<a class="map-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(day.psMap)}" target="_blank">🗺️</a>`:''}</div>`:''}<button class="edit-btn" onclick="window.triggerEdit(${idx})">✏️ 修改行程</button></div></div>`}).join('');
        document.querySelectorAll('.day-header').forEach(h=>{h.addEventListener('click',(e)=>{const idx=h.dataset.dayidx;appData.itineraryOpen[idx]=!appData.itineraryOpen[idx];renderItinerary();updateItineraryWeather();autoSave();});});
        updateItineraryWeather();
      }
      window.triggerEdit=(idx)=>enableEditMode(idx);

      function renderTransport() { const c=document.getElementById('transportContainer'); if(!c)return; c.innerHTML=appData.transportData.map(t=>`<div class="day-card"><div class="day-title" style="margin-bottom:10px;">${t.title}${t.map?`<a class="map-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.map)}" target="_blank">🗺️</a>`:''}</div>${t.hasSeparator?(t.optionsPart1||[]).map(o=>`<div class="transport-option">${o}</div>`).join('')+'<div class="transport-separator">👜🛒👜🛒👜🛒👜🛒👜🛒👜🛒</div>'+(t.optionsPart2||[]).map(o=>`<div class="transport-option">${o}</div>`).join(''):t.options.map(o=>`<div class="transport-option">${o}</div>`).join('')}${t.ps?`<div class="transport-ps">${t.ps}</div>`:''}</div>`).join(''); }
      function renderMemos() { const c=document.getElementById('memoContainer'); if(!c)return; const memos=appData.memos||DEFAULT_MEMOS; c.innerHTML=Object.entries(memos).map(([key,memo])=>{const open=(appData.memoOpen&&appData.memoOpen[key])||false;return`<div class="day-card"><div class="day-header" data-memokey="${key}"><span class="day-title">📝 ${memo.title||key}</span></div><div class="trip-details" style="display:${open?'block':'none'};"><div style="white-space:pre-wrap;font-size:13px;color:#4a2c38;">${memo.content||'（未有內容）'}</div><button class="edit-btn" onclick="window.editMemo('${key}')">✏️ 編輯備忘</button></div></div>`}).join('');document.querySelectorAll('#memoContainer .day-header').forEach(h=>{h.addEventListener('click',(e)=>{const key=h.dataset.memokey;if(!appData.memoOpen)appData.memoOpen={};appData.memoOpen[key]=!appData.memoOpen[key];renderMemos();autoSave();});}); }
      window.editMemo=(key)=>{const memos=appData.memos||DEFAULT_MEMOS;const memo=memos[key]||{title:key,content:''};const nc=prompt(`編輯備忘：${memo.title}`,memo.content||'');if(nc!==null){memo.content=nc;memos[key]=memo;appData.memos=memos;renderMemos();autoSave();}};

      function updatePayerOptions(){const c=parseInt(document.getElementById('peopleCount').value)||2;const s=document.getElementById('payerSelect');s.innerHTML=appData.people.slice(0,c).map(p=>`<option value="${p}">${p}</option>`).join('');renderCustomInputs();}
      function renderCustomInputs(){const m=document.getElementById('splitMode').value;const c=parseInt(document.getElementById('peopleCount').value)||2;const co=document.getElementById('customAmounts');if(m==='custom'){co.style.display='block';co.innerHTML=appData.people.slice(0,c).map(p=>`<div class="flex-row" style="margin-bottom:4px;"><span style="width:30px;">${p}</span><input type="number" class="custom-amount" data-person="${p}" placeholder="金額" step="1" style="flex:1;"></div>`).join('');}else{co.style.display='none';}}
      function addExpense(){const n=document.getElementById('expenseName').value.trim();const t=parseFloat(document.getElementById('totalAmount').value);const cu=document.getElementById('currencySelect').value;const pc=parseInt(document.getElementById('peopleCount').value);const pa=document.getElementById('payerSelect').value;const mo=document.getElementById('splitMode').value;if(!n||isNaN(t)||t<=0)return alert('請填寫名稱與金額');let sp={};const pl=appData.people.slice(0,pc);if(mo==='equal'){const per=Math.floor(t/pc);pl.forEach(p=>sp[p]=per);}else{document.querySelectorAll('.custom-amount').forEach(inp=>{sp[inp.dataset.person]=parseFloat(inp.value)||0;});}appData.expenses.push({id:Date.now(),name:n,total:t,currency:cu,payer:pa,mode:mo,splits:sp,peopleCount:pc,timestamp:new Date().toISOString()});renderExpenses();autoSave();document.getElementById('expenseName').value='';document.getElementById('totalAmount').value='';}
      function toggleSettle(id){appData.settledItems[id]=!appData.settledItems[id];renderExpenses();autoSave();}
      function deleteExpense(id){appData.expenses=appData.expenses.filter(e=>e.id!==id);delete appData.settledItems[id];renderExpenses();autoSave();}
      function renderExpenses(){const l=document.getElementById('expenseList');if(!l)return;l.innerHTML=appData.expenses.map(exp=>`<div class="expense-card ${appData.settledItems[exp.id]?'settled-line':''}"><div><strong>${exp.name}</strong> (${exp.currency}) 總額: ${exp.total}</div><div>👤 付款: ${exp.payer} | ${exp.mode==='equal'?'人均':'分開付'}</div><div class="flex-row" style="justify-content:space-between;"><button onclick="window.toggleSettle(${exp.id})">${appData.settledItems[exp.id]?'✅已結清':'⬜ 未結'}</button><button onclick="window.deleteExpense(${exp.id})" style="background:#e0b0b0;">🗑️</button></div></div>`).join('');}
      function calculateFinal(){const r=appData.rate;const b={};appData.people.forEach(p=>b[p]=0);appData.expenses.forEach(exp=>{if(appData.settledItems[exp.id])return;b[exp.payer]=(b[exp.payer]||0)+exp.total;Object.entries(exp.splits).forEach(([p,a])=>b[p]=(b[p]||0)-a);});return b;}
      function showFinalSummary(){const b=calculateFinal();const r=appData.rate;const d=document.getElementById('finalSummary');if(!d)return;let h='<div><strong>🧾 最終結算 (未結清項目)</strong></div>';const e=Object.entries(b);if(!e.length)h+='<div>無待結算項目</div>';else e.forEach(([p,a])=>{const j=Math.round(a);h+=`<div>${p}: ${a>=0?'收':'付'} ${Math.abs(j)}日圓 (約HK$${Math.abs(j*r).toFixed(2)})</div>`;});h+='<hr><div>💞 付款建議：</div>';const pp=appData.people;for(let i=0;i<pp.length;i++){for(let j=i+1;j<pp.length;j++){const a=pp[i],b2=pp[j];const df=(b[a]||0)-(b[b2]||0);if(Math.abs(df)>0.5){const pr=df>0?b2:a,rc=df>0?a:b2;const am=Math.abs(df);h+=`<div>💖 ${pr} 應付 ${rc} ${Math.round(am)}日圓 (HK$${(am*r).toFixed(2)})</div>`;}}}d.innerHTML=h;}
      function convertCurrency(){const r=parseFloat(document.getElementById('rateInput').value)||0.052;appData.rate=r;const j=parseFloat(document.getElementById('jpyInput').value);const hk=parseFloat(document.getElementById('hkdInput').value);if(!isNaN(j))document.getElementById('hkdInput').value=(j*r).toFixed(2);else if(!isNaN(hk))document.getElementById('jpyInput').value=(hk/r).toFixed(0);autoSave();}

      window.onload=()=>{
        loadFromStorage();
        downloadFromCloud(false).then(()=>{renderItinerary();renderTransport();renderMemos();updatePayerOptions();renderExpenses();document.getElementById('rateInput').value=appData.rate;});
        document.getElementById('manualSyncBtn').addEventListener('click',manualSync);
        document.querySelectorAll('.nav-btn').forEach(b=>{b.addEventListener('click',(e)=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById(b.dataset.section).classList.add('active');});});
        document.getElementById('peopleCount').addEventListener('change',updatePayerOptions);
        document.getElementById('splitMode').addEventListener('change',renderCustomInputs);
        document.getElementById('addExpenseBtn').addEventListener('click',addExpense);
        document.getElementById('settleAllBtn').addEventListener('click',showFinalSummary);
        document.getElementById('convertBtn').addEventListener('click',convertCurrency);
        document.getElementById('rateInput').addEventListener('change',e=>{appData.rate=parseFloat(e.target.value);autoSave();});
        window.toggleSettle=toggleSettle; window.deleteExpense=deleteExpense;
        document.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',autoSave));
        setInterval(()=>downloadFromCloud(false),SYNC_INTERVAL);
        window.addEventListener('beforeunload',()=>uploadToCloud());
      };
    })();
  </script>
</body>
</html>
