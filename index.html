          formData.append('data', JSON.stringify(appData));
          const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData });
          const result = await response.json();
          if (result.success) {
            appData._lastUpdated = result.serverTimestamp;
            lastCloudUpdate = result.serverTimestamp;
            saveToStorage();
            document.getElementById('saveStatus').innerHTML = '☁️ 已同步';
            document.getElementById('syncStatus').textContent = '✅ 已同步到雲端';
            setTimeout(() => { document.getElementById('saveStatus').innerHTML = '💾 已儲存'; }, 2000);
          } else if (result.message === '版本過舊，請先同步最新資料') {
            document.getElementById('syncStatus').textContent = '⚠️ 版本衝突，正在同步...';
            await downloadFromCloud(true);
          }
        } catch (e) {
          console.log('上載失敗:', e);
          document.getElementById('syncStatus').textContent = '⚠️ 同步失敗，將重試';
        }
        isUploading = false;
      }

      async function downloadFromCloud(showAlert = false) {
        try {
          const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=load&t=${Date.now()}`);
          const data = await response.json();
          if (data && Object.keys(data).length > 0 && data.tripDays) {
            const cloudTimestamp = data._serverTimestamp || 0;
            const localTimestamp = appData._lastUpdated || 0;
            if (cloudTimestamp > localTimestamp) {
              const merged = { 
                ...appData,
                ...data,
                settledItems: { ...appData.settledItems, ...(data.settledItems || {}) },
                itineraryOpen: { ...appData.itineraryOpen, ...(data.itineraryOpen || {}) },
                memoOpen: { ...appData.memoOpen, ...(data.memoOpen || {}) },
                _lastUpdated: cloudTimestamp,
                _serverTimestamp: cloudTimestamp
              };
              // 保護唔被雲端舊資料覆蓋
              merged.transportData = DEFAULT_TRANSPORT;
              merged.people = DEFAULT_PEOPLE;
              merged.memos = DEFAULT_MEMOS;

              const oldStr = JSON.stringify({...appData, _lastUpdated: null, _serverTimestamp: null});
              const newStr = JSON.stringify({...merged, _lastUpdated: null, _serverTimestamp: null});
              if (oldStr !== newStr) {
                appData = merged;
                saveToStorage();
                renderItinerary();
                renderExpenses();
                renderTransport();
                renderMemos();
                updateItineraryWeather();
                document.getElementById('rateInput').value = appData.rate;
                document.getElementById('saveStatus').innerHTML = '☁️ 已更新';
                document.getElementById('syncStatus').textContent = '📥 已接收雲端更新';
                setTimeout(() => { document.getElementById('saveStatus').innerHTML = '💾 已儲存'; }, 2000);
                if (showAlert) alert('✅ 已從雲端同步最新資料！');
              } else {
                document.getElementById('syncStatus').textContent = '⏱️ 資料已是最新';
              }
            } else if (cloudTimestamp === localTimestamp) {
              document.getElementById('syncStatus').textContent = '⏱️ 資料已同步';
            }
          }
        } catch (e) {
          console.log('下載失敗:', e);
          document.getElementById('syncStatus').textContent = '⚠️ 無法連接雲端';
        }
      }

      function manualSync() {
        document.getElementById('syncStatus').textContent = '🔄 同步中...';
        Promise.all([uploadToCloud(), downloadFromCloud(true)]).then(() => {
          document.getElementById('syncStatus').textContent = '✅ 同步完成';
        });
      }

      // ---------- 儲存 ----------
      function saveToStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...appData, version: 7 }));
        } catch (e) {}
      }

      function loadFromStorage() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            appData = { ...appData, ...parsed };
            // 再次保護
            appData.transportData = DEFAULT_TRANSPORT;
            appData.people = DEFAULT_PEOPLE;
            appData.memos = DEFAULT_MEMOS;
          } catch (e) {}
        }
      }

      function autoSave() {
        appData._lastUpdated = Date.now();
        saveToStorage();
        uploadToCloud();
      }

      // ---------- 天氣 ----------
      const weatherCache = { data: null, timestamp: null, ttl: 30 * 60 * 1000 };
      async function fetchWeatherForDays() {
        if (weatherCache.data && weatherCache.timestamp && (Date.now() - weatherCache.timestamp) < weatherCache.ttl) {
          return weatherCache.data;
        }
        try {
          const [kyotoRes, osakaRes] = await Promise.all([
            fetch('https://api.open-meteo.com/v1/forecast?latitude=35.0116&longitude=135.7681&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia/Tokyo&forecast_days=7'),
            fetch('https://api.open-meteo.com/v1/forecast?latitude=34.6937&longitude=135.5022&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia/Tokyo&forecast_days=7')
          ]);
          const [kyotoData, osakaData] = await Promise.all([kyotoRes.json(), osakaRes.json()]);
          const icons = { 0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌧️',53:'🌧️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'🌨️',75:'🌨️',80:'🌧️',81:'🌧️',82:'🌧️',95:'⛈️' };
          const map = {};
          kyotoData.daily.time.forEach((d,i) => map[d] = { kyoto: { icon: icons[kyotoData.daily.weather_code[i]] || '🌡️', max: Math.round(kyotoData.daily.temperature_2m_max[i]), min: Math.round(kyotoData.daily.temperature_2m_min[i]) } });
          osakaData.daily.time.forEach((d,i) => { if (map[d]) map[d].osaka = { icon: icons[osakaData.daily.weather_code[i]] || '🌡️', max: Math.round(osakaData.daily.temperature_2m_max[i]), min: Math.round(osakaData.daily.temperature_2m_min[i]) }; });
          weatherCache.data = map;
          weatherCache.timestamp = Date.now();
          return map;
        } catch (e) { return null; }
      }

      async function updateItineraryWeather() {
        const tags = document.querySelectorAll('.weather-tag');
        tags.forEach(t => t.classList.add('loading'));
        const data = await fetchWeatherForDays();
        if (!data) { tags.forEach(t => { t.classList.remove('loading'); t.textContent = '🌡️ 天氣暫無法載入'; }); return; }
        const mapping = { '2026-08-05':'8/5 (三)','2026-08-06':'8/6 (四)','2026-08-07':'8/7 (五)','2026-08-08':'8/8 (六)','2026-08-09':'8/9 (日)','2026-08-10':'8/10 (一)','2026-08-11':'8/11 (二)' };
        tags.forEach(tag => {
          tag.classList.remove('loading');
          const card = tag.closest('.day-card');
          if (!card) return;
          const header = card.querySelector('.day-title')?.textContent || '';
          let matched = null;
          for (const [api, disp] of Object.entries(mapping)) if (header.includes(disp)) { matched = api; break; }
          if (matched && data[matched]) {
            const w = matched <= '2026-08-07' ? data[matched].kyoto : data[matched].osaka;
            tag.textContent = w ? `${w.icon} ${w.min}°-${w.max}°C` : '🌡️ 資料缺失';
          }
        });
      }

      // ---------- 行程 ----------
      function enableEditMode(idx) {
        const day = appData.tripDays[idx];
        const card = document.querySelectorAll('.day-card')[idx];
        const details = card.querySelector('.trip-details');
        const old = details.querySelector('.edit-panel');
        if (old) old.remove();
        if (!day.times) day.times = day.details.map(() => '');
        const panel = document.createElement('div');
        panel.className = 'edit-panel';
        panel.innerHTML = `
          <label>📝 行程重點</label>
          <input type="text" id="editTitle_${idx}" value="${day.title.replace(/"/g, '&quot;')}">
          <label style="margin-top:10px;">📋 詳細行程項目（時間 + 描述 + 地圖）</label>
          <div id="editItems_${idx}">
            ${day.details.map((d,i) => `
              <div class="edit-item" data-index="${i}">
                <input type="text" class="time-input" value="${(day.times[i]||'')}" placeholder="時間">
                <input type="text" class="detail-input" value="${d.replace(/"/g, '&quot;')}" placeholder="行程描述">
                <input type="text" class="map-input" value="${(day.maps[i]||'')}" placeholder="地圖關鍵字">
                <button class="remove-item-btn" onclick="window.removeEditItem(${idx},${i})">✕</button>
              </div>
            `).join('')}
          </div>
          <button class="add-item-btn" onclick="window.addEditItem(${idx})">➕ 增加行程</button>
          <button class="save-edit-btn" onclick="window.saveEdit(${idx})">💾 儲存修改</button>
        `;
        details.appendChild(panel);
      }

      window.removeEditItem = (dayIdx, itemIdx) => {
        const c = document.getElementById(`editItems_${dayIdx}`);
        const items = c.querySelectorAll('.edit-item');
        if (items.length <= 1) { alert('至少保留一個項目'); return; }
        items[itemIdx].remove();
        c.querySelectorAll('.edit-item').forEach((el,i) => el.dataset.index = i);
      };
      window.addEditItem = (dayIdx) => {
        const c = document.getElementById(`editItems_${dayIdx}`);
        const i = c.querySelectorAll('.edit-item').length;
        const div = document.createElement('div');
        div.className = 'edit-item';
        div.dataset.index = i;
        div.innerHTML = `<input type="text" class="time-input" placeholder="時間"><input type="text" class="detail-input" placeholder="新行程描述"><input type="text" class="map-input" placeholder="地圖關鍵字"><button class="remove-item-btn" onclick="window.removeEditItem(${dayIdx},${i})">✕</button>`;
        c.appendChild(div);
      };
      window.saveEdit = (dayIdx) => {
        const title = document.getElementById(`editTitle_${dayIdx}`)?.value.trim();
        if (title) appData.tripDays[dayIdx].title = title;
        const items = document.querySelectorAll(`#editItems_${dayIdx} .edit-item`);
        const times = [], details = [], maps = [];
        items.forEach(el => {
          const t = el.querySelector('.time-input')?.value.trim() || '';
          const d = el.querySelector('.detail-input')?.value.trim();
          const m = el.querySelector('.map-input')?.value.trim() || '';
          if (d) { times.push(t); details.push(d); maps.push(m); }
        });
        if (details.length === 0) { alert('請至少保留一個行程項目'); return; }
        appData.tripDays[dayIdx].times = times;
        appData.tripDays[dayIdx].details = details;
        appData.tripDays[dayIdx].maps = maps;
        renderItinerary();
        autoSave();
      };

      function renderItinerary() {
        const c = document.getElementById('daysContainer');
        if (!c) return;
        c.innerHTML = appData.tripDays.map((day, idx) => {
          const open = appData.itineraryOpen[idx] || false;
          return `<div class="day-card">
            <div class="day-header" data-dayidx="${idx}">
              <span class="day-title">📌 ${day.date} ${day.title}</span>
              <span class="weather-tag loading">🌡️ 載入中...</span>
            </div>
            <div class="trip-details" style="display:${open?'block':'none'};">
              ${day.details.map((d,i) => {
                const time = (day.times&&day.times[i])?day.times[i]:'';
                const mapLink = (day.maps&&day.maps[i])?`<a class="map-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(day.maps[i])}" target="_blank">🗺️</a>`:'';
                return `<div class="timeline-item"><span class="item-time">${time||'全天'}</span><span class="item-desc">${d} ${mapLink}</span></div>`;
              }).join('')}
              <div style="margin-top:6px;font-style:italic;color:#c94b6c;font-size:12px;">🚶‍♀️ 交通：請依出口指標移動</div>
              <button class="edit-btn" onclick="window.triggerEdit(${idx})">✏️ 修改行程</button>
            </div>
          </div>`;
        }).join('');
        document.querySelectorAll('.day-header').forEach(h => {
          h.addEventListener('click', (e) => {
            const idx = h.dataset.dayidx;
            appData.itineraryOpen[idx] = !appData.itineraryOpen[idx];
            renderItinerary();
            updateItineraryWeather();
            autoSave();
          });
        });
        updateItineraryWeather();
      }
      window.triggerEdit = (idx) => enableEditMode(idx);

      // ---------- 交通 ----------
      function renderTransport() {
        const c = document.getElementById('transportContainer');
        if (!c) return;
        c.innerHTML = appData.transportData.map(t => `
          <div class="day-card">
            <div class="day-title" style="margin-bottom:10px;">
              ${t.title}
              ${t.map ? `<a class="map-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.map)}" target="_blank">🗺️</a>` : ''}
            </div>
            ${t.hasSeparator ? 
              (t.optionsPart1||[]).map(o=>`<div class="transport-option">${o}</div>`).join('') + 
              '<div class="transport-separator">👜🛒👜🛒👜🛒👜🛒👜🛒👜🛒</div>' + 
              (t.optionsPart2||[]).map(o=>`<div class="transport-option">${o}</div>`).join('')
              : t.options.map(o=>`<div class="transport-option">${o}</div>`).join('')
            }
            ${t.ps?`<div class="transport-ps">${t.ps}</div>`:''}
          </div>
        `).join('');
      }

      // ---------- 備忘 ----------
      function renderMemos() {
        const c = document.getElementById('memoContainer');
        if (!c) return;
        const memos = appData.memos || DEFAULT_MEMOS;
        c.innerHTML = Object.entries(memos).map(([key, memo]) => {
          const open = (appData.memoOpen && appData.memoOpen[key]) || false;
          return `<div class="day-card">
            <div class="day-header" data-memokey="${key}">
              <span class="day-title">📝 ${memo.title || key}</span>
            </div>
            <div class="trip-details" style="display:${open?'block':'none'};">
              <div style="white-space:pre-wrap;font-size:13px;color:#4a2c38;">${memo.content || '（未有內容）'}</div>
              <button class="edit-btn" onclick="window.editMemo('${key}')">✏️ 編輯備忘</button>
            </div>
          </div>`;
        }).join('');
        document.querySelectorAll('#memoContainer .day-header').forEach(h => {
          h.addEventListener('click', (e) => {
            const key = h.dataset.memokey;
            if (!appData.memoOpen) appData.memoOpen = {};
            appData.memoOpen[key] = !appData.memoOpen[key];
            renderMemos();
            autoSave();
          });
        });
      }

      window.editMemo = (key) => {
        const memos = appData.memos || DEFAULT_MEMOS;
        const memo = memos[key] || { title: key, content: '' };
        const newContent = prompt(`編輯備忘：${memo.title}`, memo.content || '');
        if (newContent !== null) {
          memo.content = newContent;
          memos[key] = memo;
          appData.memos = memos;
          renderMemos();
          autoSave();
        }
      };

      // ---------- 記帳 ----------
      function updatePayerOptions() {
        const count = parseInt(document.getElementById('peopleCount').value) || 2;
        const sel = document.getElementById('payerSelect');
        const ppl = appData.people.slice(0, count);
        sel.innerHTML = ppl.map(p => `<option value="${p}">${p}</option>`).join('');
        renderCustomInputs();
      }
      function renderCustomInputs() {
        const mode = document.getElementById('splitMode').value;
        const count = parseInt(document.getElementById('peopleCount').value) || 2;
        const container = document.getElementById('customAmounts');
        if (mode === 'custom') {
          container.style.display = 'block';
          container.innerHTML = appData.people.slice(0,count).map(p => `
            <div class="flex-row" style="margin-bottom:4px;"><span style="width:30px;">${p}</span><input type="number" class="custom-amount" data-person="${p}" placeholder="金額" step="1" style="flex:1;"></div>
          `).join('');
        } else { container.style.display = 'none'; }
      }
      function addExpense() {
        const name = document.getElementById('expenseName').value.trim();
        const total = parseFloat(document.getElementById('totalAmount').value);
        const currency = document.getElementById('currencySelect').value;
        const peopleCount = parseInt(document.getElementById('peopleCount').value);
        const payer = document.getElementById('payerSelect').value;
        const mode = document.getElementById('splitMode').value;
        if (!name || isNaN(total) || total <= 0) return alert('請填寫名稱與金額');
        let splits = {};
        const ppl = appData.people.slice(0, peopleCount);
        if (mode === 'equal') {
          const per = Math.floor(total / peopleCount);
          ppl.forEach(p => splits[p] = per);
        } else {
          document.querySelectorAll('.custom-amount').forEach(inp => {
            splits[inp.dataset.person] = parseFloat(inp.value) || 0;
          });
        }
        appData.expenses.push({ id: Date.now(), name, total, currency, payer, mode, splits, peopleCount, timestamp: new Date().toISOString() });
        renderExpenses();
        autoSave();
        document.getElementById('expenseName').value = '';
        document.getElementById('totalAmount').value = '';
      }
      function toggleSettle(id) { appData.settledItems[id] = !appData.settledItems[id]; renderExpenses(); autoSave(); }
      function deleteExpense(id) { appData.expenses = appData.expenses.filter(e=>e.id!==id); delete appData.settledItems[id]; renderExpenses(); autoSave(); }
      function renderExpenses() {
        const list = document.getElementById('expenseList');
        if (!list) return;
        list.innerHTML = appData.expenses.map(exp => `
          <div class="expense-card ${appData.settledItems[exp.id]?'settled-line':''}">
            <div><strong>${exp.name}</strong> (${exp.currency}) 總額: ${exp.total}</div>
            <div>👤 付款: ${exp.payer} | ${exp.mode==='equal'?'人均':'分開付'}</div>
            <div class="flex-row" style="justify-content:space-between;">
              <button onclick="window.toggleSettle(${exp.id})">${appData.settledItems[exp.id]?'✅已結清':'⬜ 未結'}</button>
              <button onclick="window.deleteExpense(${exp.id})" style="background:#e0b0b0;">🗑️</button>
            </div>
          </div>
        `).join('');
      }
      function calculateFinal() {
        const rate = appData.rate;
        const bal = {};
        appData.people.forEach(p => bal[p] = 0);
        appData.expenses.forEach(exp => {
          if (appData.settledItems[exp.id]) return;
          bal[exp.payer] = (bal[exp.payer]||0) + exp.total;
          Object.entries(exp.splits).forEach(([p,amt]) => bal[p] = (bal[p]||0) - amt);
        });
        return bal;
      }
      function showFinalSummary() {
        const bal = calculateFinal();
        const rate = appData.rate;
        const div = document.getElementById('finalSummary');
        if (!div) return;
        let html = '<div><strong>🧾 最終結算 (未結清項目)</strong></div>';
        const entries = Object.entries(bal);
        if (!entries.length) html += '<div>無待結算項目</div>';
        else entries.forEach(([p,amt]) => {
          const jpy = Math.round(amt);
          html += `<div>${p}: ${amt>=0?'收':'付'} ${Math.abs(jpy)}日圓 (約HK$${Math.abs(jpy*rate).toFixed(2)})</div>`;
        });
        html += '<hr><div>💞 付款建議：</div>';
        const ppl = appData.people;
        for (let i=0;i<ppl.length;i++) {
          for (let j=i+1;j<ppl.length;j++) {
            const a=ppl[i],b=ppl[j];
            const diff = (bal[a]||0)-(bal[b]||0);
            if (Math.abs(diff)>0.5) {
              const payer = diff>0?b:a, receiver = diff>0?a:b;
              const amt = Math.abs(diff);
              html += `<div>💖 ${payer} 應付 ${receiver} ${Math.round(amt)}日圓 (HK$${(amt*rate).toFixed(2)})</div>`;
            }
          }
        }
        div.innerHTML = html;
      }
      function convertCurrency() {
        const rate = parseFloat(document.getElementById('rateInput').value)||0.052;
        appData.rate = rate;
        const jpy = parseFloat(document.getElementById('jpyInput').value);
        const hkd = parseFloat(document.getElementById('hkdInput').value);
        if (!isNaN(jpy)) document.getElementById('hkdInput').value = (jpy*rate).toFixed(2);
        else if (!isNaN(hkd)) document.getElementById('jpyInput').value = (hkd/rate).toFixed(0);
        autoSave();
      }

      // ---------- 啟動 ----------
      window.onload = () => {
        loadFromStorage();
        downloadFromCloud(false).then(() => {
          renderItinerary();
          renderTransport();
          renderMemos();
          updatePayerOptions();
          renderExpenses();
          document.getElementById('rateInput').value = appData.rate;
        });
        document.getElementById('manualSyncBtn').addEventListener('click', manualSync);
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(btn.dataset.section).classList.add('active');
          });
        });
        document.getElementById('peopleCount').addEventListener('change', updatePayerOptions);
        document.getElementById('splitMode').addEventListener('change', renderCustomInputs);
        document.getElementById('addExpenseBtn').addEventListener('click', addExpense);
        document.getElementById('settleAllBtn').addEventListener('click', showFinalSummary);
        document.getElementById('convertBtn').addEventListener('click', convertCurrency);
        document.getElementById('rateInput').addEventListener('change', e => { appData.rate = parseFloat(e.target.value); autoSave(); });
        window.toggleSettle = toggleSettle;
        window.deleteExpense = deleteExpense;
        document.querySelectorAll('input, select').forEach(el => el.addEventListener('change', autoSave));
        setInterval(() => downloadFromCloud(false), SYNC_INTERVAL);
        window.addEventListener('beforeunload', () => uploadToCloud());
      };
    })();
  </script>
</body>
</html>
