      font-size: 12px;
      margin-left: 6px;
      color: white;

      font-size: 12px;

      font-weight: 600;
      display: block;

      font-size: 13px;
      min-height: 120px;

      outline: none;

      background: #ffffffba;
      padding: 8px;

      text-align: center;

    .edit-item input.map-input {

      color: white;

      width: 26px;
      height: 26px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;

    .add-item-btn {

      border: none;
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 6px;

      <button class="nav-btn" data-section="memo">📝 備忘</button>
    </div>

    <!-- 同步控制按鈕 -->

    </div>

    <!-- 行程區 -->

    </div>

    <!-- 記帳區 -->

      <div style="margin-bottom:16px; display:flex; gap:8px;">
        <input type="text" id="expenseName" placeholder="項目名稱 (例: 午餐)" style="flex:2;">
        <input type="number" id="totalAmount" placeholder="總額" step="1" style="flex:1;">
      </div>
      <div class="flex-row">
        <select id="currencySelect"><option value="JPY">日圓 ¥</option><option value="HKD">港幣 HK$</option></select>
        <input type="number" id="peopleCount" placeholder="人數" value="2" min="2" max="4" style="width:70px;">
        <select id="splitMode"><option value="equal">人均</option><option value="custom">分開付</option></select>
        <select id="payerSelect"><option>付款人</option></select>
      </div>
      <div id="customAmounts" style="display:none; margin-top:8px;"></div>
      <button id="addExpenseBtn" style="margin-top:10px; width:100%;">➕ 新增帳目</button>
      <div id="expenseList" style="margin-top:14px;"></div>
      <button id="settleAllBtn" style="background:#d46a7a; margin-top:12px; width:100%;">📋 最終結算明細</button>
      <div id="finalSummary" style="margin-top:10px; background:#fff0f3; border-radius:20px; padding:12px;"></div>
    </div>

    <!-- 匯率計算器 -->
    <div id="calculator" class="section">
      <div style="background: #fff0f5; border-radius: 24px; padding: 18px;">
        <label>🌸 匯率設定 (每1日圓兌港幣)</label>
        <input type="number" id="rateInput" step="0.0001" value="0.052" style="width:100%; margin:6px 0;">
        <div class="flex-row">
          <input type="number" id="jpyInput" placeholder="日圓" style="flex:1;">
          <span>⇄</span>
          <input type="number" id="hkdInput" placeholder="港幣" style="flex:1;">
        </div>
        <button id="convertBtn" style="margin-top:8px; width:100%;">🔄 換算</button>
      </div>
    </div>

    <!-- 交通區 -->
    <div id="transport" class="section">
      <div id="transportContainer"></div>
    </div>

    <!-- 備忘區 -->
    <div id="memo" class="section">
      <div id="memoContainer"></div>
    </div>

    <footer>
      🌸 天氣資料來源：Open-Meteo | 雲端同步：Google Sheets | Japan Travel © 2026

            body: formData
          });
          
          const result = await response.json();
          
          if (result.success) {
            appData._lastUpdated = result.serverTimestamp;
            lastCloudUpdate = result.serverTimestamp;
            saveToStorage();
            document.getElementById('saveStatus').innerHTML = '☁️ 已同步';
            document.getElementById('syncStatus').textContent = '✅ 已同步到雲端';
            setTimeout(() => {
              document.getElementById('saveStatus').innerHTML = '💾 已儲存';
            }, 2000);
          } else if (result.message === '版本過舊，請先同步最新資料') {
            document.getElementById('syncStatus').textContent = '⚠️ 版本衝突，正在同步...';
            await downloadFromCloud(true);
          }
        } catch (e) {
          console.log('☁️ 上載失敗:', e);
          document.getElementById('syncStatus').textContent = '⚠️ 同步失敗，將重試';
        }
        isUploading = false;
      }

      async function downloadFromCloud(showAlert = false) {
        try {
          const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=load&t=${Date.now()}`);
          const data = await response.json();
          
          if (data && Object.keys(data).length > 0 && data.tripDays) {
            const cloudTimestamp = data._serverTimestamp || 0;
            const localTimestamp = appData._lastUpdated || 0;
            
            if (cloudTimestamp > localTimestamp) {
              const merged = { 
                ...appData,
                ...data, 
                settledItems: { ...appData.settledItems, ...(data.settledItems || {}) },
                itineraryOpen: { ...appData.itineraryOpen, ...(data.itineraryOpen || {}) },
                memoOpen: { ...appData.memoOpen, ...(data.memoOpen || {}) },
                _lastUpdated: cloudTimestamp,
                _serverTimestamp: cloudTimestamp
              };
              
              const oldDataStr = JSON.stringify({...appData, _lastUpdated: null, _serverTimestamp: null});
              const newDataStr = JSON.stringify({...merged, _lastUpdated: null, _serverTimestamp: null});
              
              if (oldDataStr !== newDataStr) {
                appData = merged;
                saveToStorage();
                renderItinerary();
                renderExpenses();
                renderTransport();
                renderMemos();
                updateItineraryWeather();
                document.getElementById('rateInput').value = appData.rate;
                document.getElementById('saveStatus').innerHTML = '☁️ 已更新';
                document.getElementById('syncStatus').textContent = '📥 已接收雲端更新';
                setTimeout(() => {
                  document.getElementById('saveStatus').innerHTML = '💾 已儲存';
                }, 2000);
                if (showAlert) alert('✅ 已從雲端同步最新資料！');
              } else {
                document.getElementById('syncStatus').textContent = '⏱️ 資料已是最新';
              }
            } else if (cloudTimestamp === localTimestamp) {
              document.getElementById('syncStatus').textContent = '⏱️ 資料已同步';
            }
          }
        } catch (e) {
          console.log('☁️ 下載失敗:', e);
          document.getElementById('syncStatus').textContent = '⚠️ 無法連接雲端';
        }
      }

      function manualSync() {
        document.getElementById('syncStatus').textContent = '🔄 同步中...';
        Promise.all([uploadToCloud(), downloadFromCloud(true)]).then(() => {
          document.getElementById('syncStatus').textContent = '✅ 同步完成';
        });
      }

      // ---------- 儲存系統 ----------
      function saveToStorage() {
        try {
          const payload = { ...appData, version: 6 };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
        } catch (e) {
          console.log('本地儲存失敗');
        }
      }

      function loadFromStorage() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          try {
            const parsed = JSON.parse(raw);
            appData = { ...appData, ...parsed };
          } catch (e) { }
        }
      }

      function autoSave() {
        appData._lastUpdated = Date.now();
        saveToStorage(); 
        uploadToCloud();
      }

      // ---------- 天氣功能 (Open-Meteo) ----------
      const weatherCache = {
        data: null,
        timestamp: null,
        ttl: 30 * 60 * 1000
      };

      async function fetchWeatherForDays() {
        if (weatherCache.data && weatherCache.timestamp && (Date.now() - weatherCache.timestamp) < weatherCache.ttl) {
          return weatherCache.data;
        }

        try {
          const [kyotoRes, osakaRes] = await Promise.all([
            fetch('https://api.open-meteo.com/v1/forecast?latitude=35.0116&longitude=135.7681&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia/Tokyo&forecast_days=7'),
            fetch('https://api.open-meteo.com/v1/forecast?latitude=34.6937&longitude=135.5022&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia/Tokyo&forecast_days=7')
          ]);

          const [kyotoData, osakaData] = await Promise.all([kyotoRes.json(), osakaRes.json()]);

          const weatherIcons = {
            0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
            45: '🌫️', 48: '🌫️', 51: '🌧️', 53: '🌧️', 55: '🌧️',
            61: '🌧️', 63: '🌧️', 65: '🌧️', 71: '🌨️', 73: '🌨️',
            75: '🌨️', 80: '🌧️', 81: '🌧️', 82: '🌧️', 95: '⛈️'
          };

          const weatherMap = {};
          kyotoData.daily.time.forEach((date, i) => {
            weatherMap[date] = {
              kyoto: {
                icon: weatherIcons[kyotoData.daily.weather_code[i]] || '🌡️',
                max: Math.round(kyotoData.daily.temperature_2m_max[i]),
                min: Math.round(kyotoData.daily.temperature_2m_min[i])
              }
            };
          });

          osakaData.daily.time.forEach((date, i) => {
            if (weatherMap[date]) {
              weatherMap[date].osaka = {
                icon: weatherIcons[osakaData.daily.weather_code[i]] || '🌡️',
                max: Math.round(osakaData.daily.temperature_2m_max[i]),
                min: Math.round(osakaData.daily.temperature_2m_min[i])
              };
            }
          });

          weatherCache.data = weatherMap;
          weatherCache.timestamp = Date.now();
          return weatherMap;
        } catch (error) {
          console.error('天氣獲取失敗:', error);
          return null;
        }
      }

      async function updateItineraryWeather() {
        const weatherTags = document.querySelectorAll('.weather-tag');
        weatherTags.forEach(tag => tag.classList.add('loading'));

        const weatherData = await fetchWeatherForDays();
        if (!weatherData) {
          weatherTags.forEach(tag => {
            tag.classList.remove('loading');
            tag.textContent = '🌡️ 天氣暫無法載入';
          });
          return;
        }

        const dateMapping = {
          '2026-08-05': '8/5 (三)', '2026-08-06': '8/6 (四)',
          '2026-08-07': '8/7 (五)', '2026-08-08': '8/8 (六)',
          '2026-08-09': '8/9 (日)', '2026-08-10': '8/10 (一)',
          '2026-08-11': '8/11 (二)'
        };

        weatherTags.forEach(tag => {
          tag.classList.remove('loading');
          const parentCard = tag.closest('.day-card');
          if (!parentCard) return;
          const headerText = parentCard.querySelector('.day-title')?.textContent || '';
          let matchedDate = null;
          for (const [apiDate, displayDate] of Object.entries(dateMapping)) {
            if (headerText.includes(displayDate)) {
              matchedDate = apiDate;
              break;
            }
          }
          if (matchedDate && weatherData[matchedDate]) {
            const weather = weatherData[matchedDate];
            const locationWeather = matchedDate <= '2026-08-07' ? weather.kyoto : weather.osaka;
            if (locationWeather) {
              tag.textContent = `${locationWeather.icon} ${locationWeather.min}°-${locationWeather.max}°C`;
            } else {
              tag.textContent = '🌡️ 資料缺失';
            }
          }
        });
      }

      window.removeEditItem = function(dayIndex, itemIndex) {
        const container = document.getElementById(`editItems_${dayIndex}`);
        const items = container.querySelectorAll('.edit-item');
        if (items.length <= 1) {
          alert('至少需要保留一個行程項目');
          return;
        }
        items[itemIndex].remove();
        const remaining = container.querySelectorAll('.edit-item');
        remaining.forEach((item, i) => item.dataset.index = i);
      };

      window.addEditItem = function(dayIndex) {
        const container = document.getElementById(`editItems_${dayIndex}`);
        const newIndex = container.querySelectorAll('.edit-item').length;
        const newItem = document.createElement('div');
        newItem.className = 'edit-item';
        newItem.dataset.index = newIndex;
        newItem.innerHTML = `
          <input type="text" class="time-input" placeholder="時間">
          <input type="text" class="detail-input" placeholder="新行程描述">
          <input type="text" class="map-input" placeholder="地圖關鍵字">
          <button class="remove-item-btn" onclick="window.removeEditItem(${dayIndex}, ${newIndex})">✕</button>
        `;
        container.appendChild(newItem);
      };

      window.saveEdit = function(dayIndex) {
        const titleInput = document.getElementById(`editTitle_${dayIndex}`);
        if (titleInput && titleInput.value.trim()) {
          appData.tripDays[dayIndex].title = titleInput.value.trim();
        }

        const container = document.getElementById(`editItems_${dayIndex}`);
        const items = container.querySelectorAll('.edit-item');
        const newTimes = [];
        const newDetails = [];
        const newMaps = [];
        
        items.forEach(item => {
          const timeInput = item.querySelector('.time-input');
          const detailInput = item.querySelector('.detail-input');
          const mapInput = item.querySelector('.map-input');
          if (detailInput.value.trim()) {
            newTimes.push(timeInput.value.trim() || '');
            newDetails.push(detailInput.value.trim());
            newMaps.push(mapInput.value.trim() || '');
          }
        });

        if (newDetails.length === 0) {
          alert('請至少保留一個行程項目');
          return;
        }

        appData.tripDays[dayIndex].times = newTimes;
        appData.tripDays[dayIndex].details = newDetails;
        appData.tripDays[dayIndex].maps = newMaps;
        
        renderItinerary();
        autoSave();
      };

      function addExpense() {
        const name = document.getElementById('expenseName').value.trim();
        const total = parseFloat(document.getElementById('totalAmount').value);
        const currency = document.getElementById('currencySelect').value;
        const peopleCount = parseInt(document.getElementById('peopleCount').value);
        const payer = document.getElementById('payerSelect').value;
        const mode = document.getElementById('splitMode').value;
        if (!name || isNaN(total) || total <= 0) return alert('請填寫名稱與金額');

        let splits = {};
        const peopleList = appData.people.slice(0, peopleCount);
        if (mode === 'equal') {
          const perPerson = Math.floor(total / peopleCount);
          peopleList.forEach(p => splits[p] = perPerson);
        } else {
          const inputs = document.querySelectorAll('.custom-amount');
          inputs.forEach(inp => {
            const person = inp.dataset.person;
            const val = parseFloat(inp.value) || 0;
            splits[person] = val;
          });
        }

        const expense = {
          id: Date.now(),
          name, total, currency, payer, mode, splits, peopleCount, timestamp: new Date().toISOString()
        };
        appData.expenses.push(expense);
        renderExpenses();
        autoSave();
        clearExpenseForm();
      }

      function clearExpenseForm() {
        document.getElementById('expenseName').value = '';
        document.getElementById('totalAmount').value = '';
      }

      function toggleSettle(id) {
        appData.settledItems[id] = !appData.settledItems[id];
        renderExpenses();
        autoSave();
      }

      function deleteExpense(id) {
        appData.expenses = appData.expenses.filter(e => e.id !== id);
        delete appData.settledItems[id];
        renderExpenses();
        autoSave();
      }

      function renderExpenses() {
        const list = document.getElementById('expenseList');
        if (!list) return;
        list.innerHTML = appData.expenses.map(exp => {
          const settled = appData.settledItems[exp.id];
          return `
            <div class="expense-card ${settled ? 'settled-line' : ''}">
              <div><strong>${exp.name}</strong> (${exp.currency}) 總額: ${exp.total}</div>
              <div>👤 付款: ${exp.payer} | ${exp.mode === 'equal' ? '人均' : '分開付'}</div>
              <div class="flex-row" style="justify-content:space-between;">
                <button onclick="window.toggleSettle(${exp.id})">${settled ? '✅已結清' : '⬜ 未結'}</button>
                <button onclick="window.deleteExpense(${exp.id})" style="background:#e0b0b0;">🗑️</button>
              </div>
            </div>
          `;
        }).join('');
      }

      function calculateFinal() {
        const rate = appData.rate;
        let balance = {};
        appData.people.forEach(p => balance[p] = 0);

        appData.expenses.forEach(exp => {
          if (appData.settledItems[exp.id]) return;
          const payer = exp.payer;
          balance[payer] = (balance[payer] || 0) + exp.total;
          Object.entries(exp.splits).forEach(([person, amount]) => {
            balance[person] = (balance[person] || 0) - amount;
          });
        });

        return balance;
      }

      function showFinalSummary() {
        const balance = calculateFinal();
        const rate = appData.rate;
        const summaryDiv = document.getElementById('finalSummary');
        if (!summaryDiv) return;
        let html = '<div><strong>🧾 最終結算 (未結清項目)</strong></div>';
        const entries = Object.entries(balance);
        if (entries.length === 0) { html += '<div>無待結算項目</div>'; }
        entries.forEach(([person, amount]) => {
          const jpy = Math.round(amount);
          const hkd = (amount * rate).toFixed(2);
          html += `<div>${person}: ${amount >= 0 ? '收' : '付'} ${Math.abs(jpy)}日圓 (約HK$${Math.abs(hkd)})</div>`;
        });

        html += '<hr><div>💞 付款建議：</div>';
        const people = appData.people;
        for (let i = 0; i < people.length; i++) {
          for (let j = i + 1; j < people.length; j++) {
            const a = people[i], b = people[j];
            const diff = (balance[a] || 0) - (balance[b] || 0);
            if (Math.abs(diff) > 0.5) {
              const payerPerson = diff > 0 ? b : a;
              const receiver = diff > 0 ? a : b;
              const amount = Math.abs(diff);
              html += `<div>💖 ${payerPerson} 應付 ${receiver} ${Math.round(amount)}日圓 (HK$${(amount * rate).toFixed(2)})</div>`;
            }
          }
        }
        summaryDiv.innerHTML = html;
      }

      function convertCurrency() {
        const rate = parseFloat(document.getElementById('rateInput').value) || 0.052;
        appData.rate = rate;
        const jpy = parseFloat(document.getElementById('jpyInput').value);
        const hkd = parseFloat(document.getElementById('hkdInput').value);
        if (!isNaN(jpy)) document.getElementById('hkdInput').value = (jpy * rate).toFixed(2);
        else if (!isNaN(hkd)) document.getElementById('jpyInput').value = (hkd / rate).toFixed(0);
        autoSave();
      }

        loadFromStorage();
        
        downloadFromCloud(false).then(() => {
          renderItinerary();
          renderTransport();
          renderMemos();
          updatePayerOptions();
          renderExpenses();
          document.getElementById('rateInput').value = appData.rate;
        });

        document.getElementById('manualSyncBtn').addEventListener('click', manualSync);

        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            document.getElementById(btn.dataset.section).classList.add('active');
          });
        });

        document.getElementById('peopleCount').addEventListener('change', updatePayerOptions);
        document.getElementById('splitMode').addEventListener('change', renderCustomInputs);
        document.getElementById('addExpenseBtn').addEventListener('click', addExpense);
        document.getElementById('settleAllBtn').addEventListener('click', showFinalSummary);
        document.getElementById('convertBtn').addEventListener('click', convertCurrency);
        document.getElementById('rateInput').addEventListener('change', (e) => { appData.rate = parseFloat(e.target.value); autoSave(); });

        window.toggleSettle = toggleSettle;
        window.deleteExpense = deleteExpense;

        document.querySelectorAll('input, select').forEach(el => el.addEventListener('change', autoSave));

        setInterval(() => {
          downloadFromCloud(false);
        }, SYNC_INTERVAL);
        
        window.addEventListener('beforeunload', () => {
          uploadToCloud();
        });
      };
    })();
  </script>
</body>
</html>
